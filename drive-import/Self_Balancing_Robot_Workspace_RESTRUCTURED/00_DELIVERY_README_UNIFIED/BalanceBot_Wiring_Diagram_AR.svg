<!-- MPU card -->
<g filter="url(#shadow)"><rect x="980" y="160" width="300" height="190" rx="18" fill="#e8f0ff" class="box"/><rect x="1010" y="195" width="240" height="90" rx="12" fill="#4f79b8"/><circle cx="1130" cy="240" r="30" fill="#d7e6ff" stroke="#193452" stroke-width="4"/><text x="1130" y="185" text-anchor="middle" class="label">MPU6050</text><text x="1130" y="320" text-anchor="middle" class="small">VCC • GND • SDA • SCL • INT</text></g>
<!-- Arduino -->
<g filter="url(#shadow)"><rect x="820" y="650" width="600" height="360" rx="24" fill="#168bb2" class="box"/><rect x="850" y="690" width="540" height="250" rx="12" fill="#1596bd" stroke="#0d4966" stroke-width="3"/><rect x="850" y="650" width="130" height="70" rx="10" fill="#d4dde7"/><circle cx="1120" cy="815" r="70" fill="#1eabc4" stroke="#0b536b" stroke-width="4"/><text x="1120" y="700" text-anchor="middle" class="label" fill="#fff">ARDUINO UNO R3</text><text x="1120" y="965" text-anchor="middle" class="small" fill="#fff">5V controller • USB Direct • PID + sensor loop</text><text x="855" y="1038" class="pin">A4 SDA | A5 SCL | D2 INT | D3 IR</text><text x="855" y="1068" class="pin">D5 ENA | D6/D7 IN1/IN2 | D8/D9 IN3/IN4 | D10 ENB</text><text x="855" y="1098" class="pin">A0 TRIG | A1 ECHO | D11,D12,D13,D4 LEDs</text></g>
<!-- L298N -->
<g filter="url(#shadow)"><rect x="650" y="650" width="900" height="355" rx="20" fill="#d84c21" class="box"/><rect x="840" y="715" width="520" height="180" rx="8" fill="#30343b"/><rect x="865" y="740" width="470" height="130" fill="#1d2025"/><text x="1100" y="690" text-anchor="middle" class="label" fill="#fff">L298N DUAL H-BRIDGE</text><text x="1100" y="820" text-anchor="middle" font-size="28" font-weight="700" fill="#ffb84d">L298N</text><text x="680" y="960" class="pin" fill="#fff">ENA D5 • IN1 D6 • IN2 D7</text><text x="1180" y="960" class="pin" fill="#fff">IN3 D8 • IN4 D9 • ENB D10</text><text x="1040" y="1038" text-anchor="middle" class="small">Battery motor input only • common GND • check current/heat</text></g>
<!-- motors -->
<g filter="url(#shadow)"><rect x="145" y="720" width="190" height="150" rx="18" fill="#4f5963" class="box"/><rect x="185" y="755" width="140" height="80" rx="8" fill="#222"/><circle cx="165" cy="795" r="58" fill="#f4cf34" stroke="#795d00" stroke-width="5"/><text x="240" y="920" text-anchor="middle" class="label">LEFT MOTOR</text><text x="240" y="950" text-anchor="middle" class="small">L298 OUT1/OUT2</text><rect x="2075" y="720" width="190" height="150" rx="18" fill="#4f5963" class="box"/><rect x="2085" y="755" width="140" height="80" rx="8" fill="#222"/><circle cx="2235" cy="795" r="58" fill="#f4cf34" stroke="#795d00" stroke-width="5"/><text x="2165" y="920" text-anchor="middle" class="label">RIGHT MOTOR</text><text x="2165" y="950" text-anchor="middle" class="small">L298 OUT3/OUT4</text></g>
<!-- ESP32 bridge -->
<g filter="url(#shadow)"><rect x="1580" y="360" width="500" height="300" rx="22" fill="#2b6cb0" class="box"/><rect x="1660" y="425" width="340" height="130" rx="12" fill="#182c48"/><text x="1830" y="405" text-anchor="middle" class="label" fill="#fff">ESP32 DEVKIT — BRIDGE</text><text x="1830" y="505" text-anchor="middle" font-size="30" font-weight="700" fill="#80caff">Wi‑Fi / HTTP / SSE</text><text x="1600" y="610" class="pin" fill="#fff">UART2 RX GPIO18 • TX GPIO19</text><text x="1600" y="640" class="pin" fill="#fff">MODE GPIO35: LOW = Bridge</text><text x="1600" y="690" class="small" fill="#fff">5V↔3.3V level shifter required</text></g>
<!-- ultrasonic -->
<g filter="url(#shadow)"><rect x="470" y="320" width="330" height="150" rx="18" fill="#f2bd3e" class="box"/><circle cx="570" cy="395" r="38" fill="#cfd5da" stroke="#4b5560" stroke-width="5"/><circle cx="700" cy="395" r="38" fill="#cfd5da" stroke="#4b5560" stroke-width="5"/><text x="635" y="350" text-anchor="middle" class="label">HC-SR04</text><text x="635" y="448" text-anchor="middle" class="small">Arduino A0/A1 • ESP32 5/34</text></g>
<!-- LEDs -->
<g filter="url(#shadow)"><rect x="350" y="560" width="340" height="135" rx="18" fill="#ffe8e8" class="box"/><circle cx="410" cy="625" r="20" fill="#e33"/><circle cx="470" cy="625" r="20" fill="#e33"/><circle cx="530" cy="625" r="20" fill="#e33"/><circle cx="590" cy="625" r="20" fill="#e33"/><text x="520" y="580" text-anchor="middle" class="label">LED STATUS ×4</text><text x="520" y="680" text-anchor="middle" class="small">Arduino D11,D12,D13,D4 • 220Ω each</text></g>
<!-- battery -->
<g filter="url(#shadow)"><rect x="1010" y="1250" width="420" height="250" rx="20" fill="#f1d56d" class="box"/><rect x="1080" y="1300" width="280" height="100" rx="8" fill="#d7bc45"/><text x="1220" y="1290" text-anchor="middle" class="label">BATTERY + SWITCH</text><text x="1220" y="1460" text-anchor="middle" class="small">→ L298N motor supply</text><text x="1220" y="1492" text-anchor="middle" class="small">Buck converter → Arduino/ESP32</text></g>
<!-- side panel standalone -->
<g><rect x="1640" y="820" width="610" height="610" rx="22" fill="#eef7ff" stroke="#2b6cb0" stroke-width="4"/><text x="1945" y="870" text-anchor="middle" class="label">ESP32 STANDALONE — بديل التوصيل</text><text x="1945" y="905" text-anchor="middle" class="small">لا تشغله مع توصيلات Arduino في الوقت نفسه</text><line x1="1680" y1="930" x2="2210" y2="930" stroke="#9eb9d3" stroke-width="2"/>
<text x="1690" y="970" class="pin">MPU6050 SDA/SCL</text><text x="2110" y="970" class="pin" text-anchor="end">GPIO21 / GPIO22</text>
<text x="1690" y="1010" class="pin">L298N IN1 / IN2</text><text x="2110" y="1010" class="pin" text-anchor="end">GPIO32 / GPIO33</text>
<text x="1690" y="1050" class="pin">L298N IN3 / IN4</text><text x="2110" y="1050" class="pin" text-anchor="end">GPIO25 / GPIO26</text>
<text x="1690" y="1090" class="pin">L298N ENA / ENB</text><text x="2110" y="1090" class="pin" text-anchor="end">GPIO27 / GPIO14</text>
<text x="1690" y="1130" class="pin">HC-SR04 Trig / Echo</text><text x="2110" y="1130" class="pin" text-anchor="end">GPIO5 / GPIO34</text>
<text x="1690" y="1170" class="pin">IR OUT</text><text x="2110" y="1170" class="pin" text-anchor="end">GPIO2</text>
<text x="1690" y="1210" class="pin">LED1..LED4</text><text x="2110" y="1210" class="pin" text-anchor="end">GPIO4,16,17,23</text>
<text x="1690" y="1250" class="pin">MODE_PIN</text><text x="2110" y="1250" class="pin" text-anchor="end">GPIO35</text>
<text x="1690" y="1290" class="pin">UART2 RX / TX</text><text x="2110" y="1290" class="pin" text-anchor="end">GPIO18 / GPIO19</text>
<text x="1690" y="1350" class="note">Echo 5V ممنوع على ESP32: استخدم مقسم جهد.</text><text x="1690" y="1385" class="note">GPIO35 input-only: لا تستخدم INPUT_PULLUP.</text></g>
