<rect width="2400" height="1700" fill="#f4f8fc"/>
<rect x="35" y="30" width="2330" height="1640" rx="28" fill="#fff" stroke="#c7d7e8" stroke-width="4"/>
<text x="1200" y="90" text-anchor="middle" class="title">BalanceBot — مخطط التوصيلات المرجعي v3</text>
<text x="1200" y="128" text-anchor="middle" class="subtitle">Arduino + ESP32 Bridge / ESP32 Standalone | pinout مطابق للـREADME وUnifiedBalance.ino | ليس مقياسًا هندسيًا</text>

