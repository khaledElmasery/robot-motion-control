<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1700" viewBox="0 0 2400 1700">
<defs>
 <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".18"/></filter>
 <style>
 .title{font:700 42px Arial,sans-serif;fill:#10233f}.subtitle{font:24px Arial,sans-serif;fill:#45617e}.label{font:700 23px Arial,sans-serif;fill:#10233f}.small{font:20px Arial,sans-serif;fill:#263b55}.tiny{font:17px Arial,sans-serif;fill:#263b55}.pin{font:700 18px Arial,sans-serif;fill:#10233f}.box{stroke:#203b5b;stroke-width:3}.wire{fill:none;stroke-linecap:round;stroke-linejoin:round}.note{font:700 20px Arial,sans-serif;fill:#7a4210}.rtl{font-family:Arial,sans-serif;direction:rtl;unicode-bidi:bidi-override}
 </style>
