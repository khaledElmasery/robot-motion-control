name: Speed update and stop command
version: 1
author: Robot Motion Control
steps:
  - delay: 250ms
  - write-serial: '+'
  - wait-serial: 'SPEED_LEVEL=6 PWM=163'
  - write-serial: 'F'
  - wait-serial: 'Received: F'
  - write-serial: 'S'
  - wait-serial: 'Received: S'
  - expect-pin:
      part-id: uno
      pin: 7
      expected: 0
  - expect-pin:
      part-id: uno
      pin: 8
      expected: 0
  - expect-pin:
      part-id: uno
      pin: 10
      expected: 0
  - expect-pin:
      part-id: uno
      pin: A0
      expected: 0
