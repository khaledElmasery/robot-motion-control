name: Heartbeat loss stops motors
version: 1
author: Robot Motion Control
steps:
  - delay: 250ms
  - write-serial: 'FZ'
  - wait-serial: 'Received: F'
  - delay: 450ms
  - wait-serial: 'WATCHDOG: heartbeat lost; motors stopped.'
  - expect-pin:
      part-id: uno
      pin: 7
      expected: 0
  - expect-pin:
      part-id: uno
      pin: 8
      expected: 0
  - expect-pin:
      part-id: uno
      pin: 10
      expected: 0
  - expect-pin:
      part-id: uno
      pin: A0
      expected: 0
