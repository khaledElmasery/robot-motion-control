name: Tilt pulse requires valid angle and clear path
version: 1
author: Robot Motion Control
steps:
  - delay: 250ms
  - set-control:
      part-id: imu
      control: accelX
      value: 1
  - delay: 150ms
  - write-serial: '^'
  - wait-serial: 'Received: ^'
  - delay: 20ms
  - expect-pin:
      part-id: uno
      pin: 8
      expected: 1
  - expect-pin:
      part-id: uno
      pin: 10
      expected: 1
