name: Forward on clear path
version: 1
author: Robot Motion Control
steps:
  - delay: 250ms
  - write-serial: 'F'
  - wait-serial: 'Received: F'
  - expect-pin:
      part-id: uno
      pin: 7
      expected: 0
  - expect-pin:
      part-id: uno
      pin: 8
      expected: 1
  - expect-pin:
      part-id: uno
      pin: 10
      expected: 1
  - expect-pin:
      part-id: uno
      pin: A0
      expected: 0
