[platformio]
default_envs = uno
src_dir = src

; The supplied wiring and firmware pins are for Arduino Uno only.
; Do not add an ESP32 build environment until its pin map is validated.
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
monitor_eol = LF
monitor_filters = default, send_on_enter
upload_speed = 115200

; Wire and tone() are supplied by the Arduino framework. The current source
; does not require PID, I2Cdev, or an external MPU6050 library.
