[platformio]
default_envs = uno
src_dir = src

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
monitor_eol = LF
monitor_filters = default, send_on_enter
upload_speed = 115200

; Mode 2: original ESP32-WROOM-32 receives Bluetooth SPP and forwards
; single-byte commands/status to an Uno over UART2.
[env:esp32_bridge]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -DROBOT_ROLE_ESP32_BRIDGE
monitor_speed = 115200
upload_speed = 460800

; Mode 3: the same ESP32 board runs the robot firmware itself.
[env:esp32_standalone]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -DROBOT_ROLE_ESP32_STANDALONE
monitor_speed = 115200
upload_speed = 460800
